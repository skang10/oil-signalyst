# Reverse-proxies /api and /ws to the backend container so the SPA and API
# are same-origin from the browser's perspective - sidesteps CORS and the
# httpOnly refresh-token cookie's cross-origin quirks entirely rather than
# reconciling them (see backend/api/main.py's CORSMiddleware, which is only
# needed for the separate-port `npm run dev` workflow).
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
