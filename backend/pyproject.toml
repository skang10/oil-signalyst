[project]
name = "oil-signalyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "apscheduler>=3.10.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.1.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "yfinance>=0.2.0",
    "fredapi>=0.5.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "workalendar>=17.0.0",
    "tabpfn-client>=0.3.0",
    "shap>=0.46.0",
    "numba>=0.60.0",
    "mlflow>=2.15.0",
    "matplotlib>=3.9.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
